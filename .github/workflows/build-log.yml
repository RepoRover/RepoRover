name: Build log

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update build log
        uses: actions/github-script@v7
        with:
          # Fine-grained PAT, read-only access to the Bfloo repos
          github-token: ${{ secrets.BFLOO_READ_TOKEN }}
          script: |
            const run = require('./.github/scripts/build-log.js');
            await run({ github });

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update build log"
            git push
          fi
